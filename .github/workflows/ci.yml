name: CI

on:
  pull_request:
  push:
    branches: [master, develop, feat/mvp, feat/more-games, feat/iteracion-3]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:multi
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
