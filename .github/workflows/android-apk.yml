name: Android APK

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK del runner
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          fi

      - run: npm ci

      - name: Export estático + sync Capacitor
        env:
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.SOCKET_URL }}
          NEXT_PUBLIC_WEB_ORIGIN: ${{ vars.NEXT_PUBLIC_WEB_ORIGIN }}
        run: |
          npm run build:mobile
          npx cap sync android

      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk la-previa-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: la-previa-debug.apk
          path: la-previa-debug.apk
          if-no-files-found: error

  signed-release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: debug-apk
    steps:
      - name: Check signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No hay secrets de firma. Skip del release firmado (el debug ya está)."
          fi

      - if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK del runner
        if: steps.signing.outputs.ready == 'true'
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          fi

      - if: steps.signing.outputs.ready == 'true'
        run: npm ci

      - name: Export estático + sync Capacitor
        if: steps.signing.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.SOCKET_URL }}
          NEXT_PUBLIC_WEB_ORIGIN: ${{ vars.NEXT_PUBLIC_WEB_ORIGIN }}
        run: |
          npm run build:mobile
          npx cap sync android

      - name: Decode keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: assembleRelease
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: la-previa-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
